<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free API Directory — Data Quality</title><link rel="stylesheet" href="app.css"><style>body{background:#f5f7fb}.quality{max-width:1200px;margin:auto;padding:28px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.metric{background:#fff;border:1px solid #e5e9f0;border-radius:16px;padding:18px}.metric b{font-size:28px;display:block}.muted{color:#667085}.bar{height:10px;background:#e8edf5;border-radius:99px;overflow:hidden}.fill{height:100%;background:#2563eb}</style></head><body><main class="quality"><nav><a href="index.html">← Home</a> · <a href="finder.html">Find APIs</a> · <a href="compare.html">Compare</a></nav><h1>Catalog Data Quality</h1><p class="muted">These metrics are generated from the same synchronized provider index used by the directory. Unknown means the directory has deliberately avoided inventing a provider claim.</p><section id="metrics" class="cards"></section><section id="details" class="metric" style="margin-top:16px"></section></main><script>
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
(async()=>{try{const r=await fetch("data/catalog-index.json?v=20260926-7",{cache:"force-cache"});if(!r.ok)throw 0;const d=await r.json(),p=d.providers||[],count=x=>p.filter(x=>x).length,free=p.filter(x=>x.free_tier===true).length,community=p.filter(x=>x.verification_status==="community-listed").length,verified=p.filter(x=>x.verification_status==="provider-verified").length,unknown=p.filter(x=>x.free_tier==null).length,cardUnknown=p.filter(x=>typeof x.requires_credit_card!=="boolean").length,stale=p.filter(x=>{if(!x.last_verified)return true;const age=(Date.now()-Date.parse(x.last_verified+"T00:00:00Z"))/86400000;return !Number.isFinite(age)||age>365}).length;document.getElementById("metrics").innerHTML=[["Total providers",p.length],["Provider-verified",verified],["Community-listed",community],["Free tier explicitly recorded",free],["Free status unknown",unknown],["Card requirement unknown",cardUnknown],["Needs verification",stale],["Categories",Object.keys(d.categories||{}).length]].map(x=>'<div class="metric"><span class="muted">'+esc(x[0])+'</span><b>'+x[1].toLocaleString()+'</b></div>').join("");const coverage=Math.round((p.filter(x=>x.verification_status==="provider-verified").length/Math.max(1,p.length))*100);document.getElementById("details").innerHTML='<h2>Verification coverage</h2><p>'+coverage+'% of catalog entries have provider-verified status. Community-listed records remain discoverable but are not presented as independently verified free tiers.</p><div class="bar"><div class="fill" style="width:'+coverage+'%"></div></div><p class="muted">Last generated from catalog-index.json.</p>'}catch(e){document.getElementById("details").textContent="Unable to load catalog quality data."}})();</script></body></html>
