<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>API Directory</title><style>:root{--bg:#f5f7fb;--card:#fff;--ink:#182033;--muted:#667085;--line:#e5e9f0;--accent:#2563eb;--accent2:#eff6ff;--shadow:0 8px 30px rgba(16,24,40,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit}.shell{max-width:1500px;margin:auto;padding:28px 28px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}.brand{font-weight:800;font-size:20px}.back{color:var(--accent);text-decoration:none;font-weight:650}.hero{background:linear-gradient(135deg,#111827,#1e3a8a);color:white;border-radius:22px;padding:30px 32px;box-shadow:var(--shadow);margin-bottom:20px}.hero h1{margin:0 0 8px;font-size:clamp(28px,4vw,42px);letter-spacing:-.03em}.hero p{margin:0;color:#dbe7ff;max-width:900px;line-height:1.6}.toolbar{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow);margin-bottom:16px}.search{flex:1;min-width:260px;padding:12px 14px;border:1px solid #d7dce5;border-radius:10px;font-size:15px;outline:none}.search:focus{border-color:#93b4f5;box-shadow:0 0 0 3px #eff6ff}.count{color:var(--muted);font-size:14px;font-weight:650}.table-card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.scroll{overflow:auto;max-height:72vh}table{width:100%;min-width:1050px;border-collapse:separate;border-spacing:0;font-size:14px}th{position:sticky;top:0;z-index:2;background:#f8fafc;color:#475467;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:14px 16px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:16px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.55}tbody tr:hover{background:#f8fbff}tbody tr:last-child td{border-bottom:0}.provider{font-weight:750;white-space:nowrap}.category{color:#475467;white-space:nowrap}.action a{display:inline-block;background:var(--accent2);color:#1d4ed8;text-decoration:none;font-weight:700;padding:7px 10px;border-radius:8px;white-space:nowrap}.action a:hover{background:#dbeafe}.uses{color:#344054}.empty{padding:45px;text-align:center;color:var(--muted)}@media(max-width:700px){.shell{padding:18px 12px 40px}.hero{padding:24px 20px}.toolbar{padding:10px}.search{min-width:0}.scroll{max-height:none}}</style></head><body><main class="shell"><div class="top"><div class="brand">Free API Directory</div><a class="back" href="./">← All criteria</a></div><section class="hero"><h1 id="title">API Directory</h1><p id="subtitle">Loading criterion…</p></section><div class="toolbar"><input id="filter" class="search" type="search" placeholder="Search providers, capabilities, categories…"><span id="count" class="count"></span></div><section class="table-card"><div class="scroll"><table><thead><tr><th>Provider</th><th>Original Category</th><th>Provider / API Key</th><th>Tier / Pricing</th><th>Major Functions & Capabilities</th></tr></thead><tbody id="body"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody></table></div></section></main><script>
const criteria={"ai-and-machine-learning":"AI & Machine Learning","blockchain-and-web3":"Blockchain & Web3","coding-and-developer-tools":"Coding & Developer Tools","communication-email-and-sms":"Communication, Email & SMS","data-research-and-public-data":"Data, Research & Public Data","e-commerce-and-shopping":"E-commerce & Shopping","finance-crypto-and-economics":"Finance, Crypto & Economics","food-and-nutrition":"Food & Nutrition","gaming":"Gaming","geospatial-maps-and-location":"Geospatial, Maps & Location","health-and-fitness":"Health & Fitness","images-media-and-video":"Images, Media & Video","iot":"IoT","jobs-and-recruiting":"Jobs & Recruiting","miscellaneous-and-utilities":"Miscellaneous & Utilities","music-and-entertainment":"Music & Entertainment","news-and-content":"News & Content","payments":"Payments","real-estate":"Real Estate","search-web-and-scraping":"Search, Web & Scraping","security-and-threat-intelligence":"Security & Threat Intelligence","social-media":"Social Media","sports":"Sports","translation-and-language":"Translation & Language","travel-and-transportation":"Travel & Transportation","weather-and-environment":"Weather & Environment"};
const base="https://raw.githubusercontent.com/chessnerd69mmtz-pixel/free-API-directory/main/docs/providers/criteria/";
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function inline(s){return esc(s).replace(/&lt;br&gt;/g,"<br>").replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')}
function render(md,title){const lines=md.split(/\r?\n/);let rows=[],inTable=false;for(const line of lines){if(line.trim().startsWith("|")){if(line.includes("|---")){inTable=true;continue}if(inTable)rows.push(line)}}const parsed=rows.map(l=>l.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(x=>x.trim()));document.title=title+" — Free API Directory";document.getElementById("title").textContent=title;document.getElementById("subtitle").textContent="Browse the APIs in this criterion with provider links, pricing/tier links, and major functions.";document.getElementById("count").textContent=parsed.length+" providers";const body=document.getElementById("body");body.innerHTML=parsed.length?parsed.map(r=>"<tr><td class='provider'>"+inline(r[0]||"")+"</td><td class='category'>"+inline(r[1]||"")+"</td><td class='action'>"+inline(r[2]||"")+"</td><td class='action'>"+inline(r[3]||"")+"</td><td class='uses'>"+inline(r[4]||"")+"</td></tr>").join(""):"<tr><td colspan='5' class='empty'>No providers found.</td></tr>";document.getElementById("filter").oninput=e=>{const q=e.target.value.toLowerCase();let n=0;for(const tr of body.rows){const show=tr.innerText.toLowerCase().includes(q);tr.style.display=show?"":"none";if(show)n++}document.getElementById("count").textContent=n+" of "+parsed.length+" providers"}}
async function start(){const slug=new URLSearchParams(location.search).get("criterion");if(!slug||!criteria[slug]){document.getElementById("title").textContent="API Directory";document.getElementById("subtitle").textContent="Choose a criterion from the homepage.";document.getElementById("count").textContent="";return}try{const r=await fetch(base+slug+".md");if(!r.ok)throw new Error();render(await r.text(),criteria[slug])}catch(e){document.getElementById("body").innerHTML="<tr><td colspan='5' class='empty'>Unable to load this criterion. Please refresh the page.</td></tr>"}}start();
</script></body></html>
