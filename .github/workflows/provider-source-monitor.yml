name: Monitor provider sources
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Rebuild the complete canonical catalog
        run: python scripts/build_catalog.py
      - name: Validate profiles
        run: python scripts/validate_profiles.py
      - name: Check official source pages
        run: python scripts/update_source_changes.py
      - name: Commit synchronized generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog-index.json data/provider_profiles.json data/profiles data/source_hashes.json data/change_log.json
          git diff --cached --quiet || git commit -m "chore: synchronize catalog and source changes"
          git push
