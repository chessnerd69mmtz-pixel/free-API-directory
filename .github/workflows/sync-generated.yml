name: Synchronize generated catalog
on:
  push:
    branches: [main]
    paths-ignore:
      - "data/catalog-index.json"
      - "data/provider_profiles.json"
      - "data/profiles/**"
      - "data/source_hashes.json"
      - "data/change_log.json"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build canonical runtime artifacts
        run: python scripts/build_catalog.py
      - name: Validate generated artifacts
        run: |
          python scripts/validate.py
          python scripts/validate_provider_schema.py
          python scripts/validate_profiles.py
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog-index.json data/provider_profiles.json data/profiles
          git diff --cached --quiet || git commit -m "chore: synchronize generated catalog"
          git push
