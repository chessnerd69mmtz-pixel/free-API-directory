name: Check provider links
on:
  push:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - id: check
        continue-on-error: true
        run: python scripts/check_links.py > link-report.txt
      - name: Open or update failure issue
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'); const body=fs.readFileSync('link-report.txt','utf8');
            const title='Broken provider links detected';
            const issues=await github.paginate(github.rest.issues.listForRepo,{owner:context.repo.owner,repo:context.repo.repo,state:'open',per_page:100});
            const existing=issues.find(i=>i.title===title);
            const full='Automated check failed on '+new Date().toISOString()+'.\n\n```text\n'+body+'\n```\n\nFix provider status through a PR; nothing is auto-merged.';
            if(existing) await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,body:full});
            else await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body:full});
      - name: Fail if links failed
        if: steps.check.outcome == 'failure'
        run: exit 1
