name: Check provider links
on:
  push:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - id: check
        continue-on-error: true
        run: python scripts/check_links.py > link-report.txt
      - name: Open or update review issue
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'); const body=fs.readFileSync('link-report.txt','utf8');
            const title='Provider source links require review';
            const issues=await github.paginate(github.rest.issues.listForRepo,{owner:context.repo.owner,repo:context.repo.repo,state:'open',per_page:100});
            const existing=issues.find(i=>i.title===title);
            const full='Automated source-link check on '+new Date().toISOString()+'. '+body;
            if(existing) await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:existing.number,body:full});
            else await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body:full});
      - name: Publish report
        run: cat link-report.txt
