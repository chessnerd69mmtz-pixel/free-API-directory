name: Validate catalog
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Rebuild canonical catalog
        run: python scripts/build_catalog.py
      - name: Ensure generated catalog is committed
        run: git diff --exit-code -- data/catalog-lite.json
      - name: Validate datasets
        run: python scripts/validate.py
      - name: Validate JavaScript syntax
        run: node --check app.js && node --check vault.js && node --check catalog.js
