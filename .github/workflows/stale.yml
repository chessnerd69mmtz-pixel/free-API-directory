name: Mark stale verifications
on:
  schedule:
    - cron: '31 4 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/mark_stale.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/providers.json
          git commit -m 'chore: mark stale provider verifications'
          git push
