<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>API Directory — Browse Categories</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#182033;--muted:#667085;--line:#e5e9f0;--accent:#2563eb;--accent2:#eff6ff;--shadow:0 8px 30px rgba(16,24,40,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}a{color:inherit}.shell{max-width:1500px;margin:auto;padding:28px 28px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}.brand{font-weight:800;font-size:20px}.back{color:var(--accent);text-decoration:none;font-weight:650}.hero{background:linear-gradient(135deg,#111827,#1e3a8a);color:white;border-radius:22px;padding:30px 32px;box-shadow:var(--shadow);margin-bottom:20px}.hero h1{margin:0 0 8px;font-size:clamp(28px,4vw,42px)}.hero p{margin:0;color:#dbe7ff;line-height:1.6}.toolbar{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow);margin-bottom:16px}.search{flex:1;min-width:260px;padding:12px 14px;border:1px solid #d7dce5;border-radius:10px;font-size:15px}.count{color:var(--muted);font-size:14px;font-weight:650}.table-card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.scroll{overflow:auto;max-height:72vh}table{width:100%;min-width:1100px;border-collapse:separate;border-spacing:0;font-size:14px}th{position:sticky;top:0;background:#f8fafc;color:#475467;text-align:left;font-size:12px;text-transform:uppercase;padding:14px 16px;border-bottom:1px solid var(--line)}td{padding:15px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}.provider{font-weight:750}.category{color:#475467}.action a{display:inline-block;background:var(--accent2);color:#1d4ed8;text-decoration:none;font-weight:700;padding:7px 10px;border-radius:8px}.uses{min-width:360px}.uses-list{margin:0;padding-left:20px}.uses-list li{margin:0 0 5px}.pill{display:inline-flex;padding:4px 9px;border-radius:999px;background:#eef2ff;color:#334155;font-size:12px;font-weight:800}.good{background:#ecfdf3;color:#15803d}.empty{padding:45px;text-align:center;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.cat{display:block;padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff;color:#1d4ed8;text-decoration:none;font-weight:750}.cat small{display:block;color:var(--muted);font-weight:500;margin-top:4px}
</style></head><body><main class="shell"><div class="top"><div class="brand">Free API Directory</div><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><a class="back" href="index.html">← Home</a><a class="back" href="finder.html">🔎 Find an API</a></div></div>
<section class="hero"><h1 id="title">Browse APIs by Criterion</h1><p id="subtitle">63 browse categories, including the original practical criteria plus newly expanded public-API categories.</p></section>
<div class="toolbar"><input id="filter" class="search" type="search" placeholder="Search providers, capabilities, categories…"><span id="count" class="count">Loading catalog…</span></div>
<section class="table-card"><div class="scroll"><table><thead><tr><th>Provider</th><th>Original Category</th><th>Provider / API Key</th><th>Tier / Pricing</th><th>Major Functions & Capabilities</th></tr></thead><tbody id="body"></tbody></table></div></section></main>
<script>
const criteria={"ai-and-machine-learning":"AI & Machine Learning","blockchain-and-web3":"Blockchain & Web3","coding-and-developer-tools":"Coding & Developer Tools","communication-email-and-sms":"Communication, Email & SMS","data-research-and-public-data":"Data, Research & Public Data","e-commerce-and-shopping":"E-commerce & Shopping","finance-crypto-and-economics":"Finance, Crypto & Economics","food-and-nutrition":"Food & Nutrition","gaming":"Gaming","geospatial-maps-and-location":"Geospatial, Maps & Location","health-and-fitness":"Health & Fitness","images-media-and-video":"Images, Media & Video","iot":"IoT","jobs-and-recruiting":"Jobs & Recruiting","miscellaneous-and-utilities":"Miscellaneous & Utilities","music-and-entertainment":"Music & Entertainment","news-and-content":"News & Content","payments":"Payments","real-estate":"Real Estate","search-web-and-scraping":"Search, Web & Scraping","security-and-threat-intelligence":"Security & Threat Intelligence","social-media":"Social Media","sports":"Sports","translation-and-language":"Translation & Language","travel-and-transportation":"Travel & Transportation","weather-and-environment":"Weather & Environment","ai-observability-and-evaluation":"AI Observability & Evaluation","ai-compute-and-gpu":"AI Compute & GPU","databases-and-backend":"Databases & Backend","vector-databases":"Vector Databases","ci-cd-and-devops":"CI/CD & DevOps","web-scraping-and-browser-automation":"Web Scraping & Browser Automation","geospatial-and-routing":"Geospatial & Routing","scientific-research":"Scientific Research","bioinformatics":"Bioinformatics","government-and-civic-data":"Government & Civic Data","animals":"Animals","anime":"Anime","anti-malware":"Anti-Malware","art-and-design":"Art & Design","authentication-and-authorization":"Authentication & Authorization","books":"Books & Literature","business":"Business","calendar":"Calendar & Time","cloud-storage-and-file-sharing":"Cloud Storage & File Sharing","dictionaries":"Dictionaries","documents-and-productivity":"Documents & Productivity","entertainment":"Entertainment","events":"Events","open-data":"Open Data","open-source-projects":"Open Source Projects","patent":"Patent & Intellectual Property","personality":"Personality","phone":"Phone & SMS Utilities","photography":"Photography","programming":"Programming","science-and-math":"Science & Math","shopping":"Shopping","test-data":"Test Data","text-analysis":"Text Analysis","tracking":"Tracking & Logistics","url-shorteners":"URL Shorteners","vehicle":"Vehicle & Auto","video":"Video"};
const DATA_URL="data/provider_profiles.json", EXPANSION_URL="data/public_apis_expansion.json";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function expand(x){return {name:x.name,category:x.category,description:x.description,signup_url:x.provider_url,pricing_url:null,documentation_url:x.provider_url,free_tier:{has_free_tier:true,type:"community-listed-free",details:"Community-listed free public API; current provider terms are not independently verified here.",amount:"Not independently quantified",expiry:"Not independently verified"},requires_credit_card:"Unverified",authentication:x.auth||"No",uses:[x.category,x.description],last_verified:null,verified_by:"public-apis-community-source",status:"upstream-community",verification_status:"community-free-source",verification_sources:{provider:x.provider_url}}}
function assign(p){const c=String(p.category||""),n=String(p.name||""),s=new Set();
if(c.startsWith("AI /"))s.add("AI & Machine Learning");if(c.startsWith("Dev Tools /"))s.add("Coding & Developer Tools");if(c.startsWith("Blockchain"))s.add("Blockchain & Web3");if(c.startsWith("Email")||c==="SMS / Communications")s.add("Communication, Email & SMS");if(c.startsWith("Finance"))s.add("Finance, Crypto & Economics");if(c==="Food"||c==="Food & Drink")s.add("Food & Nutrition");if(c==="Gaming"||c==="Games & Comics")s.add("Gaming");if(c.startsWith("Health"))s.add("Health & Fitness");if(c.startsWith("Images /")||c==="Video / Streaming"||c==="Video")s.add("Images, Media & Video");if(c==="IoT")s.add("IoT");if(c.startsWith("Jobs"))s.add("Jobs & Recruiting");if(c.startsWith("Maps /")||c==="Geocoding")s.add("Geospatial, Maps & Location");if(c.startsWith("Music"))s.add("Music & Entertainment");if(c.startsWith("News"))s.add("News & Content");if(c.startsWith("Payments"))s.add("Payments");if(c==="Real Estate")s.add("Real Estate");if(c.startsWith("Search /"))s.add("Search, Web & Scraping");if(c.startsWith("Security"))s.add("Security & Threat Intelligence");if(c==="Social Media"||c==="Social")s.add("Social Media");if(c.startsWith("Sports"))s.add("Sports");if(c.startsWith("Translation"))s.add("Translation & Language");if(c.startsWith("Travel")||c==="Transportation")s.add("Travel & Transportation");if(c.startsWith("Weather"))s.add("Weather & Environment");if(c.startsWith("Public /")||c==="Analytics"||c==="Open Data")s.add("Data, Research & Public Data");if(c==="E-commerce / Shopping"||c==="Shopping")s.add("E-commerce & Shopping");
const exact={"Animals":"Animals","Anime":"Anime","Anti-Malware":"Anti-Malware","Art & Design":"Art & Design","Authentication & Authorization":"Authentication & Authorization","Books":"Books & Literature","Business":"Business","Calendar":"Calendar & Time","Cloud Storage & File Sharing":"Cloud Storage & File Sharing","Dictionaries":"Dictionaries","Documents & Productivity":"Documents & Productivity","Entertainment":"Entertainment","Events":"Events","Open Data":"Open Data","Open Source Projects":"Open Source Projects","Patent":"Patent & Intellectual Property","Personality":"Personality","Phone":"Phone & SMS Utilities","Photography":"Photography","Programming":"Programming","Science & Math":"Science & Math","Shopping":"Shopping","Test Data":"Test Data","Text Analysis":"Text Analysis","Tracking":"Tracking & Logistics","URL Shorteners":"URL Shorteners","Vehicle":"Vehicle & Auto","Video":"Video"};
if(exact[c])s.add(exact[c]);if(!s.size)s.add("Miscellaneous & Utilities");
if(["OpenAI API","Anthropic API","Google Gemini API","Groq","Mistral AI","DeepSeek API","xAI API","OpenRouter","Hugging Face","Cohere","NVIDIA NIM APIs","Replicate","DeepInfra","Perplexity API","Together AI","Fireworks AI","AI21 Labs","Jina AI","Cerebras"].includes(n))s.add("AI & Machine Learning");
return [...s]}
function link(url,label){return url?'<a href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(label||"Open")+"</a>":"<span>Unverified</span>"}
function uses(a){return '<ul class="uses-list">'+(Array.isArray(a)&&a.length?a:["Not independently specified"]).map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>"}
let APIS=[];
async function load(){const local=await fetch(DATA_URL).then(r=>r.json());const ex=await fetch(EXPANSION_URL).then(r=>r.json());const seen=new Set();APIS=[];for(const p of local){const k=String(p.name).toLowerCase();if(!seen.has(k)){seen.add(k);APIS.push(p)}}for(const x of ex.providers||[]){const p=expand(x),k=p.name.toLowerCase();if(!seen.has(k)){seen.add(k);APIS.push(p)}}}
function render(){const slug=new URLSearchParams(location.search).get("criterion");const q=document.getElementById("filter").value.toLowerCase().trim();if(!slug||!criteria[slug]){document.getElementById("title").textContent="Browse APIs by Criterion";document.getElementById("subtitle").textContent="Choose from 63 categories. Counts are live against the expanded catalog.";const body=document.getElementById("body");body.innerHTML='<tr><td colspan="5"><div class="grid">'+Object.entries(criteria).map(([k,v])=>{const n=APIS.filter(p=>assign(p).includes(v)).length;return '<a class="cat" href="criteria.html?criterion='+encodeURIComponent(k)+'">'+esc(v)+'<small>'+n+' provider memberships</small></a>'}).join("")+"</div></td></tr>";document.getElementById("count").textContent=Object.keys(criteria).length+" criteria";return}
const title=criteria[slug];document.getElementById("title").textContent=title;let rows=APIS.filter(p=>assign(p).includes(title));const original=rows.length;rows=rows.filter(p=>!q||JSON.stringify([p.name,p.category,p.description,p.uses]).toLowerCase().includes(q));document.getElementById("count").textContent=rows.length+" of "+original+" provider memberships";document.getElementById("body").innerHTML=rows.length?rows.map(p=>'<tr><td class="provider">'+esc(p.name)+'</td><td class="category">'+esc(p.category||"General")+'</td><td class="action">'+link(p.signup_url,"Open provider / key page")+'</td><td class="action">'+(p.pricing_url?link(p.pricing_url,"Check tiers"):'<span class="pill">Community-listed</span>')+'</td><td class="uses">'+uses(p.uses)+'</td></tr>').join(""):'<tr><td colspan="5" class="empty">No providers found.</td></tr>'}
document.getElementById("filter").oninput=render;load().then(render).catch(e=>{document.getElementById("body").innerHTML='<tr><td colspan="5" class="empty">Unable to load the expanded catalog: '+esc(e.message)+'</td></tr>'});
</script></body></html>
