<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free API Directory — Browse Categories</title><link rel="stylesheet" href="app.css"><style>body{margin:0;background:#f5f7fb;color:#182033;font-family:Inter,system-ui,sans-serif}.shell{max-width:1500px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:16px;margin-bottom:22px}.brand{font-weight:800;font-size:20px}.back{color:#2563eb;text-decoration:none;font-weight:700}.hero{background:linear-gradient(135deg,#111827,#1e3a8a);color:white;border-radius:22px;padding:30px;margin-bottom:18px}.hero p{color:#dbe7ff;line-height:1.6}.toolbar,.card{background:white;border:1px solid #e5e9f0;border-radius:16px;padding:14px;box-shadow:0 8px 30px rgba(16,24,40,.07);margin-bottom:16px}.search{width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #d7dce5;border-radius:10px;font-size:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.cat{display:block;padding:16px;border:1px solid #e5e9f0;border-radius:12px;background:#fff;color:#1d4ed8;text-decoration:none;font-weight:750}.cat small{display:block;color:#667085;font-weight:500;margin-top:4px}.scroll{overflow:auto;max-height:72vh}table{width:100%;min-width:1000px;border-collapse:collapse;font-size:14px}th{position:sticky;top:0;background:#f8fafc;text-align:left;padding:14px;border-bottom:1px solid #e5e9f0}td{padding:14px;border-bottom:1px solid #e5e9f0;vertical-align:top;line-height:1.5}.muted{color:#667085}.provider{font-weight:750}.action a{color:#1d4ed8;font-weight:700}.empty{text-align:center;padding:45px;color:#667085}</style></head><body><main class="shell"><div class="top"><div class="brand">Free API Directory</div><div><a class="back" href="index.html">← Home</a> &nbsp; <a class="back" href="finder.html">🔎 Find an API</a></div></div><section class="hero"><h1 id="title">Browse APIs by Category</h1><p id="subtitle">Categories and provider counts come from the same runtime catalog used by Finder.</p></section><div class="toolbar"><input id="filter" class="search" type="search" placeholder="Search categories…"><span id="count" class="muted"></span></div><section id="content"></section></main><script>const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));const safeUrl=u=>{try{const x=new URL(String(u),location.href);return x.protocol==="https:"||x.protocol==="http:"?x.href:null}catch(_){return null}};const slug=s=>String(s).toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"general";const filter=document.getElementById("filter"),content=document.getElementById("content");let catalog;async function load(){const r=await fetch("data/catalog-index.json?v=20260926-9",{cache:"force-cache"});if(!r.ok)throw Error("HTTP "+r.status);catalog=await r.json();if(!Array.isArray(catalog.providers))throw Error("Invalid catalog")}function groups(){const m=new Map();for(const p of catalog.providers){const k=slug(p.category);if(!m.has(k))m.set(k,{label:p.category,count:0});m.get(k).count++}return [...m.entries()].sort((a,b)=>a[1].label.localeCompare(b[1].label))}function renderCategories(){const q=filter.value.toLowerCase().trim(),g=groups().filter(x=>!q||x[1].label.toLowerCase().includes(q));document.getElementById("title").textContent="Browse APIs by Category";document.getElementById("subtitle").textContent=catalog.provider_count+" providers across "+groups().length+" generated categories.";document.getElementById("count").textContent=g.length+" categories";content.innerHTML='<div class="grid">'+g.map(x=>'<a class="cat" href="criteria.html?criterion='+encodeURIComponent(x[0])+'">'+esc(x[1].label)+'<small>'+x[1].count+' providers</small></a>').join("")+'</div>'}function renderCategory(k){const g=groups().find(x=>x[0]===k);if(!g){renderCategories();return}const q=filter.value.toLowerCase().trim(),rows=catalog.providers.filter(p=>slug(p.category)===k&&(!q||[p.name,p.description,p.category].join(" ").toLowerCase().includes(q)));document.getElementById("title").textContent=g[1].label;document.getElementById("subtitle").textContent=g[1].count+" providers in this category.";document.getElementById("count").textContent=rows.length+" of "+g[1].count;content.innerHTML='<div class="card"><div class="scroll"><table><thead><tr><th>Provider</th><th>Description</th><th>Free tier</th><th>Provider / API key</th><th>Status</th></tr></thead><tbody>'+rows.map(p=>'<tr><td class="provider"><a href="api.html?provider='+encodeURIComponent(p.name)+'">'+esc(p.name)+'</a></td><td>'+esc(p.description)+'</td><td>'+(p.free_tier===true?"Recorded":p.free_tier===false?"No free tier recorded":"Not publicly stated")+'</td><td class="action">'+(safeUrl(p.signup_url)?'<a href="'+esc(safeUrl(p.signup_url))+'" target="_blank" rel="noopener noreferrer nofollow">Open provider / key page</a>':"Not publicly stated")+'</td><td>'+esc(p.status||"Catalog only")+'</td></tr>').join("")+'</tbody></table></div></div>'}(async()=>{try{await load();const k=new URLSearchParams(location.search).get("criterion");filter.addEventListener("input",()=>k?renderCategory(k):renderCategories());k?renderCategory(k):renderCategories()}catch(e){content.innerHTML='<div class="empty">Unable to load the catalog. Please refresh after deployment.</div>'}})();</script></body></html>
