<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>API Directory — Browse Categories</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#182033;--muted:#667085;--line:#e5e9f0;--accent:#2563eb;--accent2:#eff6ff;--shadow:0 8px 30px rgba(16,24,40,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}a{color:inherit}.shell{max-width:1500px;margin:auto;padding:28px 28px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}.brand{font-weight:800;font-size:20px}.back{color:var(--accent);text-decoration:none;font-weight:650}.hero{background:linear-gradient(135deg,#111827,#1e3a8a);color:white;border-radius:22px;padding:30px 32px;box-shadow:var(--shadow);margin-bottom:20px}.hero h1{margin:0 0 8px;font-size:clamp(28px,4vw,42px)}.hero p{margin:0;color:#dbe7ff;line-height:1.6}.toolbar{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow);margin-bottom:16px}.search{flex:1;min-width:260px;padding:12px 14px;border:1px solid #d7dce5;border-radius:10px;font-size:15px}.count{color:var(--muted);font-size:14px;font-weight:650}.table-card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.scroll{overflow:auto;max-height:72vh}table{width:100%;min-width:1100px;border-collapse:separate;border-spacing:0;font-size:14px}th{position:sticky;top:0;background:#f8fafc;color:#475467;text-align:left;font-size:12px;text-transform:uppercase;padding:14px 16px;border-bottom:1px solid var(--line)}td{padding:15px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}.provider{font-weight:750}.category{color:#475467}.action a{display:inline-block;background:var(--accent2);color:#1d4ed8;text-decoration:none;font-weight:700;padding:7px 10px;border-radius:8px}.uses{min-width:360px}.uses-list{margin:0;padding-left:20px}.uses-list li{margin:0 0 5px}.pill{display:inline-flex;padding:4px 9px;border-radius:999px;background:#eef2ff;color:#334155;font-size:12px;font-weight:800}.empty{padding:45px;text-align:center;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.cat{display:block;padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff;color:#1d4ed8;text-decoration:none;font-weight:750;transition:transform .12s ease,box-shadow .12s ease}.cat:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.cat small{display:block;color:var(--muted);font-weight:500;margin-top:4px}
</style></head><body><main class="shell"><div class="top"><div class="brand">Free API Directory</div><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><a class="back" href="index.html">← Home</a><a class="back" href="finder.html">🔎 Find an API</a></div></div>
<section class="hero"><h1 id="title">Browse APIs by Criterion</h1><p id="subtitle">Choose from 64 categories. Provider memberships are generated from the canonical catalog build.</p></section>
<div class="toolbar"><input id="filter" class="search" type="search" placeholder="Search categories…"><span id="count" class="count">64 categories</span></div>
<section class="table-card"><div id="content"></div></section></main>
<script>
const criteria={"ai-and-machine-learning":"AI & Machine Learning","blockchain-and-web3":"Blockchain & Web3","coding-and-developer-tools":"Coding & Developer Tools","communication-email-and-sms":"Communication, Email & SMS","data-research-and-public-data":"Data, Research & Public Data","e-commerce-and-shopping":"E-commerce & Shopping","finance-crypto-and-economics":"Finance, Crypto & Economics","food-and-nutrition":"Food & Nutrition","gaming":"Gaming","geospatial-maps-and-location":"Geospatial, Maps & Location","health-and-fitness":"Health & Fitness","images-media-and-video":"Images, Media & Video","iot":"IoT","jobs-and-recruiting":"Jobs & Recruiting","miscellaneous-and-utilities":"Miscellaneous & Utilities","music-and-entertainment":"Music & Entertainment","news-and-content":"News & Content","payments":"Payments","real-estate":"Real Estate","search-web-and-scraping":"Search, Web & Scraping","security-and-threat-intelligence":"Security & Threat Intelligence","social-media":"Social Media","sports":"Sports","translation-and-language":"Translation & Language","travel-and-transportation":"Travel & Transportation","weather-and-environment":"Weather & Environment","ai-observability-and-evaluation":"AI Observability & Evaluation","ai-compute-and-gpu":"AI Compute & GPU","databases-and-backend":"Databases & Backend","vector-databases":"Vector Databases","ci-cd-and-devops":"CI/CD & DevOps","web-scraping-and-browser-automation":"Web Scraping & Browser Automation","geospatial-and-routing":"Geospatial & Routing","scientific-research":"Scientific Research","bioinformatics":"Bioinformatics","government-and-civic-data":"Government & Civic Data","animals":"Animals","anime":"Anime","anti-malware":"Anti-Malware","art-and-design":"Art & Design","authentication-and-authorization":"Authentication & Authorization","books":"Books & Literature","business":"Business","calendar":"Calendar & Time","cloud-storage-and-file-sharing":"Cloud Storage & File Sharing","dictionaries":"Dictionaries","documents-and-productivity":"Documents & Productivity","entertainment":"Entertainment","events":"Events","open-data":"Open Data","open-source-projects":"Open Source Projects","patent":"Patent & Intellectual Property","personality":"Personality","phone":"Phone & SMS Utilities","photography":"Photography","programming":"Programming","science-and-math":"Science & Math","shopping":"Shopping","test-data":"Test Data","text-analysis":"Text Analysis","tracking":"Tracking & Logistics","url-shorteners":"URL Shorteners","vehicle":"Vehicle & Auto","video":"Video"};
const index={"version":"2026-09-26-2630","totalProviders":2630,"categories":{"ai-and-machine-learning":{"label":"AI & Machine Learning","count":224},"blockchain-and-web3":{"label":"Blockchain & Web3","count":140},"coding-and-developer-tools":{"label":"Coding & Developer Tools","count":398},"communication-email-and-sms":{"label":"Communication, Email & SMS","count":48},"data-research-and-public-data":{"label":"Data, Research & Public Data","count":131},"e-commerce-and-shopping":{"label":"E-commerce & Shopping","count":31},"finance-crypto-and-economics":{"label":"Finance, Crypto & Economics","count":211},"food-and-nutrition":{"label":"Food & Nutrition","count":32},"gaming":{"label":"Gaming","count":119},"geospatial-maps-and-location":{"label":"Geospatial, Maps & Location","count":143},"health-and-fitness":{"label":"Health & Fitness","count":107},"images-media-and-video":{"label":"Images, Media & Video","count":128},"iot":{"label":"IoT","count":3},"jobs-and-recruiting":{"label":"Jobs & Recruiting","count":36},"miscellaneous-and-utilities":{"label":"Miscellaneous & Utilities","count":33},"music-and-entertainment":{"label":"Music & Entertainment","count":66},"news-and-content":{"label":"News & Content","count":36},"payments":{"label":"Payments","count":3},"real-estate":{"label":"Real Estate","count":3},"search-web-and-scraping":{"label":"Search, Web & Scraping","count":46},"security-and-threat-intelligence":{"label":"Security & Threat Intelligence","count":87},"social-media":{"label":"Social Media","count":70},"sports":{"label":"Sports","count":71},"translation-and-language":{"label":"Translation & Language","count":8},"travel-and-transportation":{"label":"Travel & Transportation","count":101},"weather-and-environment":{"label":"Weather & Environment","count":85},"ai-observability-and-evaluation":{"label":"AI Observability & Evaluation","count":6},"ai-compute-and-gpu":{"label":"AI Compute & GPU","count":4},"databases-and-backend":{"label":"Databases & Backend","count":22},"vector-databases":{"label":"Vector Databases","count":6},"ci-cd-and-devops":{"label":"CI/CD & DevOps","count":18},"web-scraping-and-browser-automation":{"label":"Web Scraping & Browser Automation","count":46},"geospatial-and-routing":{"label":"Geospatial & Routing","count":143},"scientific-research":{"label":"Scientific Research","count":50},"bioinformatics":{"label":"Bioinformatics","count":7},"government-and-civic-data":{"label":"Government & Civic Data","count":142},"animals":{"label":"Animals","count":27},"anime":{"label":"Anime","count":20},"anti-malware":{"label":"Anti-Malware","count":17},"art-and-design":{"label":"Art & Design","count":29},"authentication-and-authorization":{"label":"Authentication & Authorization","count":6},"books":{"label":"Books & Literature","count":27},"business":{"label":"Business","count":44},"calendar":{"label":"Calendar & Time","count":21},"cloud-storage-and-file-sharing":{"label":"Cloud Storage & File Sharing","count":9},"dictionaries":{"label":"Dictionaries","count":15},"documents-and-productivity":{"label":"Documents & Productivity","count":51},"entertainment":{"label":"Entertainment","count":18},"events":{"label":"Events","count":3},"open-data":{"label":"Open Data","count":66},"open-source-projects":{"label":"Open Source Projects","count":12},"patent":{"label":"Patent & Intellectual Property","count":4},"personality":{"label":"Personality","count":34},"phone":{"label":"Phone & SMS Utilities","count":6},"photography":{"label":"Photography","count":29},"programming":{"label":"Programming","count":5},"science-and-math":{"label":"Science & Math","count":41},"shopping":{"label":"Shopping","count":23},"test-data":{"label":"Test Data","count":42},"text-analysis":{"label":"Text Analysis","count":21},"tracking":{"label":"Tracking & Logistics","count":12},"url-shorteners":{"label":"URL Shorteners","count":23},"vehicle":{"label":"Vehicle & Auto","count":18},"video":{"label":"Video","count":57}}};
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const link=(u,l)=>u?'<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(l||"Open")+"</a>":"<span>Unverified</span>";
const uses=a=>'<ul class="uses-list">'+(Array.isArray(a)&&a.length?a:["Not independently specified"]).map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>";
const content=document.getElementById("content"),filter=document.getElementById("filter");
function renderCategories(){
 const q=filter.value.toLowerCase().trim();
 const entries=Object.entries(index.categories).filter(([k,v])=>!q||v.label.toLowerCase().includes(q));
 document.getElementById("count").textContent=entries.length+" of "+Object.keys(criteria).length+" categories";
 content.innerHTML='<div class="grid" style="padding:18px">'+entries.map(([k,v])=>'<a class="cat" href="criteria.html?criterion='+encodeURIComponent(k)+'">'+esc(v.label)+'<small>'+v.count+' provider memberships</small></a>').join("")+'</div>';
}
async function renderCriterion(slug){
 const meta=index.categories[slug]; if(!meta){renderCategories();return}
 filter.placeholder="Search providers, capabilities…";
 document.getElementById("title").textContent=meta.label;
 document.getElementById("subtitle").textContent=meta.count+" provider memberships in this category.";
 document.getElementById("count").textContent="Loading "+meta.count+" providers…";
 content.innerHTML='<div class="empty">Opening category…</div>';
 try{
  const res=await fetch("data/criteria-data.json?v=20260926",{cache:"force-cache"});
  if(!res.ok)throw new Error("HTTP "+res.status);
  const data=await res.json(), rows=data.categories[slug]?.providers||[];
  function draw(){
   const q=filter.value.toLowerCase().trim();
   const shown=rows.filter(p=>!q||JSON.stringify([p.name,p.category,p.description,p.uses]).toLowerCase().includes(q));
   document.getElementById("count").textContent=shown.length+" of "+rows.length+" provider memberships";
   content.innerHTML=shown.length?'<div class="scroll"><table><thead><tr><th>Provider</th><th>Original Category</th><th>Provider / API Key</th><th>Tier / Pricing</th><th>Major Functions & Capabilities</th></tr></thead><tbody>'+shown.map(p=>'<tr><td class="provider">'+esc(p.name)+'</td><td class="category">'+esc(p.category)+'</td><td class="action">'+link(p.signup_url,"Open provider / key page")+'</td><td class="action">'+(p.pricing_url?link(p.pricing_url,"Check tiers"):'<span class="pill">Community-listed</span>')+'</td><td class="uses">'+uses(p.uses)+'</td></tr>').join("")+'</tbody></table></div>':'<div class="empty">No providers match that search.</div>';
  }
  filter.addEventListener("input",draw); draw();
 }catch(e){content.innerHTML='<div class="empty">Unable to open this category. <a href="criteria.html">Return to categories</a>.</div>';document.getElementById("count").textContent="Load error"}
}
const slug=new URLSearchParams(location.search).get("criterion");
if(slug) renderCriterion(slug); else {filter.addEventListener("input",renderCategories);renderCategories();}
</script></body></html>
